function doAction(action,el){switch(action){case'menu':mobileOpen=true;render();break;case'menu-close':mobileOpen=false;render();break;case'close-modal':closeModal();break;case'competency-check':if(!state.choice){toast('Выберите вариант действия.');break}state.competencyChecked=true;persist();render();break;case'send-request':{const r=state.request;const err=!Object.values(r).every(v=>v.trim())?'Заполните все выделенные поля.':!/^\d{2}\.\d{2}\.\d{4}$/.test(r.date)||!/^\d{2}\.\d{2}\.\d{4}$/.test(r.deadline)?'Укажите даты в формате ДД.ММ.ГГГГ.':r.phone.replace(/\D/g,'').length<10?'Проверьте учебный телефон исполнителя.':'';if(err){$('#request-error').innerHTML=`<p class="error-text">${err}</p>`;return}state.requestSent=true;persist();render();toast('Учебный запрос отправлен. Ответ района доступен.');break}case'hint':state.hint++;persist();render();break;case'check-answer':if(state.answer.trim().length<80){toast('Подготовьте содержательный ответ заявителю.');break}state.attempts++;state.issues=evaluateAnswer();state.completed=state.issues.length===0;issueFilter='all';persist();navigate(state.completed?11:10);break;case'sample':modal('Исправленный образец','<p>Образец заменит текущий текст ответа и заполнит учебные данные исполнителя. Он включает причину отмены, срок ремонта, временную схему и ссылку на ответ района.</p><div class="button-row" style="margin-top:20px">'+button('Вставить образец','sample-confirm')+button('Продолжить самостоятельно','close-modal','')+'</div>');break;case'sample-confirm':closeModal();correctedSample();break;case'search':modal('Поиск по практикуму',`<label class="field">Документ, тема или номер<input id="search-input" type="search" placeholder="Например, ОГ-1245 или ремонт" autocomplete="off"></label><div class="search-results" id="search-results">${searchResults()}</div>`);break;case'notifications':modal('Уведомления',`<div class="card"><div class="overline">15.09.2026 · Входящее</div><h3 style="margin:8px 0">Новое обращение ОГ-1245</h3><p>Отменён школьный автобус Лесное — Кедровка.</p><div style="margin-top:14px"><button class="btn primary" data-go="3" data-dismiss="1">Открыть обращение</button></div></div>${state.requestSent?`<div class="card"><div class="overline">21.09.2026 · Ответ района</div><h3 style="margin:8px 0">Получен ответ № 412</h3><p>Срок ремонта и временная схема подвоза доступны в учебном деле.</p><div style="margin-top:14px"><button class="btn" data-go="8" data-dismiss="1">Изучить ответ</button></div></div>`:''}${state.completed?'<div class="success-banner">Кейс ОГ-1245 завершён. Результат добавлен в портфолио.</div>':''}`);break;case'about':modal('О практикуме',`<p>«ГосСтарт.Практикум» — учебная среда по материалам 12 экранов презентации. Вы работаете в роли ведущего специалиста отдела общего образования.</p><p>Все организации, персональные данные, даты и показатели используются в рамках учебного сценария. Запросы, согласования и отправка ответа моделируются внутри сайта.</p><p>Подсказки и проверка работают локально по заданным правилам; подключение к внешнему ИИ отсутствует. Стажировка и обращение к эксперту оформляются как скачиваемые черновики.</p><p>Прогресс ${storageOK?'сохраняется в этом браузере.':'сейчас хранится только до закрытия страницы: браузер не разрешил локальное сохранение.'} HTML-файл работает без интернета.</p>`);break;case'export':download('gosstart-progress.txt',reportText());toast('Файл с прогрессом подготовлен.');break;case'download-answer':download('otvet-OG-1245.txt','МИНИСТЕРСТВО ОБРАЗОВАНИЯ КРАСНОЯРСКОГО КРАЯ\n\nГражданину А. (данные обезличены)\n\n'+state.answer+'\n\nЗаместитель министра: И. П. Соколов\nИсполнитель: '+state.executor+', '+state.phone+'\n\nУчебный документ.');break;case'reset':modal('Начать практикум заново?',`<p>Текущий прогресс, черновики и результаты проверок в этом браузере будут сброшены. При необходимости сначала скачайте прогресс.</p><div class="button-row" style="margin-top:20px">${button('Скачать прогресс','export','')}${button('Сбросить и начать','reset-confirm')}${button('Отмена','close-modal','')}</div>`);break;case'reset-confirm':closeModal();state=structuredClone(initial);law='273';twinTab='routes';issueFilter='all';navigate(1);toast('Можно начать новый рабочий день.');break;case'appeal-review':modal('Обращение к эксперту',`<form id="appeal-form" class="form-stack"><p>Укажите замечание, с которым не согласны, и обоснование. В автономной версии обращение сохраняется как черновик для передачи преподавателю.</p><label class="field">Ваше обоснование<textarea id="appeal-text" required minlength="10" style="min-height:130px" placeholder="С каким замечанием вы не согласны и почему?">${esc(state.appeal)}</textarea></label><div class="button-row"><button class="btn primary" type="submit">Сохранить и скачать черновик</button>${button('Отмена','close-modal','')}</div></form>`);break;case'internship':modal('Заявка на стажировку',`<form id="internship-form" class="form-stack"><p>Подготовьте учебную заявку в министерство. После заполнения можно скачать черновик; автоматической отправки нет.</p><label class="field">ФИО<input name="name" value="${esc(state.application?.name||'Анна Ковалёва')}" required></label><div class="field-grid"><label class="field">Курс<input name="course" type="number" min="1" max="4" value="${state.course}" required></label><label class="field">Направление<input name="program" value="${esc(state.application?.program||'Государственное и муниципальное управление')}" required></label></div><label class="field">Почему вы хотите пройти стажировку?<textarea name="motivation" required minlength="10" placeholder="Какие задачи и навыки вас интересуют?">${esc(state.application?.motivation||'')}</textarea></label><button class="btn primary" type="submit">Сохранить и скачать заявку</button></form>`);break;case'past-case':{const n=el.dataset.case;modal(n==='ВХ-0712'?'Запрос прокуратуры о переполненности классов':'Обращение о питании в школе',`<p><b>${esc(n)}</b> · пример завершённого кейса из учебного профиля.</p><p>Оценка: <b>${n==='ВХ-0712'?'52/60':'49/60'}</b>. Попыток: ${n==='ВХ-0712'?'1':'2'}.</p><p class="muted">Документы этого кейса в презентации не приведены. Полный интерактивный сценарий доступен для обращения ОГ-1245.</p><div style="margin-top:20px"><button class="btn primary" data-go="3" data-dismiss="1">Открыть ОГ-1245</button></div>`);break}case'task-heating':modal('ПР-0391 · Готовность школ к отопительному сезону',`<p>Поручение заместителя министра: подготовить справку для совещания.</p><p><b>Срок:</b> 5 учебных дней. <b>Статус:</b> на контроле.</p><p class="muted">В презентации приведена карточка задачи. Исходные данные о готовности школ и сценарий её выполнения не включены.</p><div style="margin-top:20px"><button class="btn primary" data-go="3" data-dismiss="1">Перейти к основному кейсу</button></div>`);break;case'task-instruction':law='instruction';modal('ВН-0877 · Инструкция по делопроизводству',`<p>Внутренний документ отдела общего образования. Срок ознакомления — 2 учебных дня.</p><p>Проверьте реквизиты: адресат, дата и номер, заголовок, ссылка на обращение, срок, подпись, исполнитель и телефон.</p><p class="muted">Полный текст изменений в материалах презентации не приведён.</p><div style="margin-top:20px"><button class="btn primary" data-go="norms" data-dismiss="1">Открыть нормативную базу</button></div>`);break}}
document.addEventListener('click',e=>{const el=e.target.closest('button,[data-action]');if(!el)return;if(el.dataset.go!==undefined){if(el.dataset.dismiss)closeModal();navigate(el.dataset.go);return}if(el.dataset.action){doAction(el.dataset.action,el);return}if(el.dataset.course){state.course=Number(el.dataset.course);persist();render();return}if(el.dataset.law){law=el.dataset.law;render();return}if(el.dataset.tab){twinTab=el.dataset.tab;render();return}if(el.dataset.filter){issueFilter=el.dataset.filter;render();return}if(el.dataset.bus){const i=Number(el.dataset.bus),years=[2012,2013,2014,2019,2021];modal('Автобус '+i,`<p><b>Год выпуска:</b> ${years[i-1]}.</p><p><b>Статус:</b> ${i===1?'в ремонте':i===5?'резерв':'на линии'}.</p>${i<4?'<p>Автобус старше 10 лет. Эти данные учтены в модели автопарка района.</p>':''}${i===1?'<p>Причина остановки маршрута Лесное — Кедровка — ремонт двигателя. Завершение ремонта по ответу района: до 05.10.2026.</p>':''}`);return}if(el.dataset.route!==undefined){const i=Number(el.dataset.route);modal(routes[i],i===0?'<p>Приостановлен с 01.09.2026. 17 детей, 4 км по трассе без тротуара.</p><p>Временный подвоз — с 28.09.2026, отправление в 07:30 и 15:10. Ремонт автобуса — до 05.10.2026.</p>':'<p>Маршрут работает.</p><p class="muted">Подробное расписание и число обучающихся для этого маршрута в материалах кейса не приведены.</p>')}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.bind){let keys=el.dataset.bind.split('.');if(keys.length===2)state[keys[0]][keys[1]]=el.value;else state[keys[0]]=el.value;if(keys[0]==='decision')state.decisionSaved=false;if(['answer','executor','phone'].includes(keys[0]))state.completed=false;persist()}if(el.id==='search-input')$('#search-results').innerHTML=searchResults(el.value)});
document.addEventListener('change',e=>{const el=e.target;if(el.name==='competency'){state.choice=el.value;state.competencyChecked=false;persist();render()}if(el.dataset.check!==undefined){state.checks[Number(el.dataset.check)]=el.checked;persist()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='decision-form'){if(!Object.values(state.decision).every(t=>t.trim().length>=3)){$('#decision-error').innerHTML='<p class="error-text">Заполните все четыре части решения.</p>';return}state.decisionSaved=true;persist();toast('Решение сохранено. Подготовьте ответ заявителю.');navigate(9)}if(e.target.id==='appeal-form'){state.appeal=$('#appeal-text').value.trim();persist();download('obrashchenie-ekspertu.txt','Учебный черновик обращения к эксперту\nКейс ОГ-1245 · попытка '+state.attempts+'\n\n'+state.appeal);closeModal();render();toast('Черновик сохранён и скачан.')}if(e.target.id==='internship-form'){const d=Object.fromEntries(new FormData(e.target));state.application=d;persist();download('zayavka-na-stazhirovku.txt','УЧЕБНЫЙ ЧЕРНОВИК ЗАЯВКИ НА СТАЖИРОВКУ\nМинистерство образования Красноярского края\n\nФИО: '+d.name+'\nКурс: '+d.course+'\nНаправление: '+d.program+'\n\nМотивация:\n'+d.motivation+'\n\nПортфолио: '+(state.completed?'7':'6')+' из 14 учебных кейсов.\n\nЗаявка подготовлена в учебной среде. Автоматическая отправка не выполнялась.');closeModal();toast('Учебная заявка сохранена и скачана.')}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mobileOpen){mobileOpen=false;render()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();doAction('search')}if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['schools','routes','fleet','staff','repairs'];let i=tabs.indexOf(twinTab);i=e.key==='Home'?0:e.key==='End'?4:(i+(e.key==='ArrowRight'?1:4))%5;twinTab=tabs[i];render();document.querySelector(`[data-tab="${twinTab}"]`).focus()}});
render();
</script>
</body>
</html>
